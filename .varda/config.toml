[defaults]
timeout_seconds = 600
operations_dir = ".varda/operations"

[[routes]]
glob = ".varda/operations/tasks/codex/**/*.md"
agent = "codex"

[agents.codex]
kind = "acp"
command = "codex"
args = ["exec", "--cd", ".", "--sandbox", "workspace-write", "--ask-for-approval", "never", "-"]

[git]
auto_commit = true
