name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Several tests create git repos and commit in them.
      - name: Configure git identity
        run: |
          git config --global user.name "varda-ci"
          git config --global user.email "ci@varda.invalid"
          git config --global init.defaultBranch main
      - run: cargo check --all-targets --locked
      - run: cargo test --locked

  # The processcontainer primitive (mxc-sdk, windows-sys) only compiles on
  # Windows; make sure it still builds.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked
