default_provider = "protonpass"

[providers.protonpass]
type = "proton-pass"
vault = "Personal"

[secrets]
# Long-lived Claude Code OAuth token (from `claude setup-token`), stored in
# Proton Pass item "Claude LongLived Token" (Personal vault), `note` field.
# Keep ONLY the pass:// reference here — never paste the raw token into config.
# Title-based reference (pass://<vault-name>/<item-title>/<field>) so a human can
# read what it points at without decoding opaque base64 IDs.
CLAUDE_CODE_OAUTH_TOKEN = { value = "pass://Personal/Claude LongLived Token/note", provider = "protonpass" }
