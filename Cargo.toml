[package]
name = "varda"
version = "0.3.1"
edition = "2024"
description = "Routes markdown tasks to AI agents (Claude, Codex, Copilot) and tracks their lifecycle"
license = "MIT"
repository = "https://github.com/nillebco/varda"
homepage = "https://github.com/nillebco/varda"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
gray_matter = "0.3"
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.48", features = ["sync", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
toml = "0.9"
uuid = { version = "1.19", features = ["v4"] }
sha2 = "0.11.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
