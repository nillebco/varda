[package]
name = "varda"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
gray_matter = "0.3"
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.48", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "time"] }
toml = "0.9"
uuid = { version = "1.19", features = ["v4"] }
